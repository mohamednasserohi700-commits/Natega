<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="استعلم عن نتيجة الثانوية العامة 2026 برقم الجلوس أو باسم الطالب، واعرف مجموعك الكلي وتقديرك العام فورًا.">
    <title>نتيجة الثانوية العامة 2026 | System Makers</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9C%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <script async
src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1645125257962461"
crossorigin="anonymous"></script>

</head>
<body>
    <div class="top-bar">
        <div class="brand">System Makers</div>
        <div class="logo-circle">📜</div>
        <h1>نتيجة الثانوية العامة 2026</h1>
        <p>ابحث برقم الجلوس أو باسم الطالب</p>
    </div>

    <div class="container">
        <div class="card">
            <div class="tabs">
                <button type="button" class="tab-btn {{ 'active' if active_tab != 'name' else '' }}" data-tab="seat">رقم الجلوس</button>
                <button type="button" class="tab-btn {{ 'active' if active_tab == 'name' else '' }}" data-tab="name">اسم الطالب</button>
            </div>

            {% if error %}
            <div class="error-box">{{ error }}</div>
            {% endif %}

            <form id="seat-form" class="tab-panel {{ '' if active_tab != 'name' else 'hidden' }}" action="{{ url_for('search') }}" method="POST">
                <input type="hidden" name="search_type" value="seat">
                <label for="seat_number">رقم الجلوس</label>
                <input
                    type="text"
                    id="seat_number"
                    name="seat_number"
                    placeholder="مثال: 2001970"
                    value="{{ seat_number or '' }}"
                    inputmode="numeric"
                    {{ 'autofocus' if active_tab != 'name' else '' }}
                    required
                >
                <button type="submit" class="btn">عرض النتيجة</button>
            </form>

            <form id="name-form" class="tab-panel {{ 'hidden' if active_tab != 'name' else '' }}" action="{{ url_for('search') }}" method="POST">
                <input type="hidden" name="search_type" value="name">
                <label for="student_name">اسم الطالب</label>
                <input
                    type="text"
                    id="student_name"
                    name="student_name"
                    placeholder="مثال: احمد محمود السيد"
                    value="{{ name_query or '' }}"
                    {{ 'autofocus' if active_tab == 'name' else '' }}
                    required
                >
                <button type="submit" class="btn">بحث</button>
            </form>
        </div>

        <a href="{{ tansik_url }}" target="_blank" rel="noopener noreferrer" class="tansik-home-banner">
            <div class="tansik-home-icon">🎓</div>
            <div class="tansik-home-text">
                <strong>تسجيل رغبات التنسيق</strong>
                <span>سجّل رغباتك في الكليات والمعاهد من خلال الموقع الرسمي</span>
            </div>
            <div class="tansik-home-arrow">←</div>
        </a>

        {% include '_footer.html' %}
    </div>

    <script>
        const tabButtons = document.querySelectorAll('.tab-btn');
        const seatForm = document.getElementById('seat-form');
        const nameForm = document.getElementById('name-form');

        tabButtons.forEach(function (btn) {
            btn.addEventListener('click', function () {
                tabButtons.forEach(function (b) { b.classList.remove('active'); });
                btn.classList.add('active');
                if (btn.dataset.tab === 'seat') {
                    seatForm.classList.remove('hidden');
                    nameForm.classList.add('hidden');
                } else {
                    nameForm.classList.remove('hidden');
                    seatForm.classList.add('hidden');
                }
            });
        });
    </script>
</body>
</html>
